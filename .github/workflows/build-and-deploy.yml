name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      BACKEND_IMAGE: docker.io/apar2025111/lemp-containers-backend
      FRONTEND_IMAGE: docker.io/apar2025111/lemp-containers-frontend

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Show repository information
      # --------------------------------------------------
      - name: Show repository information
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Commit: $GITHUB_SHA"
          echo "Branch: $GITHUB_REF_NAME"

      # --------------------------------------------------
      # 3. Set image tags
      # --------------------------------------------------
      - name: Set image tags
        run: |
          echo "BACKEND_IMAGE_TAG=${BACKEND_IMAGE}:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE_TAG=${FRONTEND_IMAGE}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 4. Login to Docker Hub
      # --------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --------------------------------------------------
      # 5. Build backend Docker image
      # --------------------------------------------------
      - name: Build backend Docker image
        run: |
          docker build \
            -t "$BACKEND_IMAGE_TAG" \
            ./backend

      # --------------------------------------------------
      # 6. Build frontend Docker image
      # --------------------------------------------------
      - name: Build frontend Docker image
        run: |
          docker build \
            -t "$FRONTEND_IMAGE_TAG" \
            ./frontend

      # --------------------------------------------------
      # 7. Push backend Docker image
      # --------------------------------------------------
      - name: Push backend Docker image
        run: |
          docker push "$BACKEND_IMAGE_TAG"

      # --------------------------------------------------
      # 8. Push frontend Docker image
      # --------------------------------------------------
      - name: Push frontend Docker image
        run: |
          docker push "$FRONTEND_IMAGE_TAG"

      # --------------------------------------------------
      # 9. Install OpenShift CLI
      # --------------------------------------------------
      - name: Install OpenShift CLI
        run: |
          curl -LO https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz
          tar -xzf openshift-client-linux.tar.gz
          sudo mv oc /usr/local/bin/oc
          oc version --client

      # --------------------------------------------------
      # 10. Login to Rahti
      # --------------------------------------------------
      - name: Login to Rahti
        run: |
          oc login \
            --token="${{ secrets.RAHTI_TOKEN }}" \
            --server="${{ secrets.RAHTI_SERVER }}"

      # --------------------------------------------------
      # 11. Select Rahti project
      # --------------------------------------------------
      - name: Select Rahti project
        run: |
          oc project aps

      # --------------------------------------------------
      # 12. Show current deployments
      # --------------------------------------------------
      - name: Show current deployments
        run: |
          echo "Current Rahti deployments:"
          oc get deployments

      # --------------------------------------------------
      # 13. Update backend deployment
      # --------------------------------------------------
      - name: Update backend deployment
        run: |
          oc set image deployment/backend \
            backend="$BACKEND_IMAGE_TAG"

      # --------------------------------------------------
      # 14. Update frontend deployment
      # IMPORTANT:
      # Rahti frontend deployment is named assignment-2
      # --------------------------------------------------
      - name: Update frontend deployment
        run: |
          oc set image deployment/assignment-2 \
            assignment-2="$FRONTEND_IMAGE_TAG"

      # --------------------------------------------------
      # 15. Wait for backend deployment
      # --------------------------------------------------
      - name: Wait for backend deployment
        run: |
          oc rollout status deployment/backend --timeout=180s

      # --------------------------------------------------
      # 16. Wait for frontend deployment
      # --------------------------------------------------
      - name: Wait for frontend deployment
        run: |
          oc rollout status deployment/assignment-2 --timeout=180s

      # --------------------------------------------------
      # 17. Check pods
      # --------------------------------------------------
      - name: Check pods
        run: |
          echo "=============================="
          echo "Rahti Pods"
          echo "=============================="
          oc get pods -o wide

      # --------------------------------------------------
      # 18. Check deployments
      # --------------------------------------------------
      - name: Check deployments
        run: |
          echo "=============================="
          echo "Rahti Deployments"
          echo "=============================="
          oc get deployments

      # --------------------------------------------------
      # 19. Check services
      # --------------------------------------------------
      - name: Check services
        run: |
          echo "=============================="
          echo "Rahti Services"
          echo "=============================="
          oc get services

      # --------------------------------------------------
      # 20. Check routes
      # --------------------------------------------------
      - name: Check routes
        run: |
          echo "=============================="
          echo "Rahti Routes"
          echo "=============================="
          oc get routes

      # --------------------------------------------------
      # 21. Final status
      # --------------------------------------------------
      - name: Deployment complete
        run: |
          echo "========================================"
          echo "Deployment completed successfully"
          echo "========================================"
          echo ""
          echo "Backend image:"
          echo "$BACKEND_IMAGE_TAG"
          echo ""
          echo "Frontend image:"
          echo "$FRONTEND_IMAGE_TAG"
          echo ""
          echo "Rahti deployments:"
          oc get deployments
          echo ""
          echo "Rahti routes:"
          oc get routes