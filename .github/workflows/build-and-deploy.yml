name: Build and Deploy Application

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # 1. Download latest project code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install OpenShift CLI
      - name: Install OpenShift CLI
        uses: redhat-actions/oc-installer@v1

      # 3. Set image names
      - name: Set image names
        run: |
          echo "BACKEND_IMAGE=apar202511/lemp-containers-backend:${GITHUB_SHA}" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE=apar202511/lemp-containers-frontend:${GITHUB_SHA}" >> $GITHUB_ENV

      # 4. Build backend image
      - name: Build backend Docker image
        run: |
          docker build \
            -f backend/Dockerfile \
            -t "$BACKEND_IMAGE" \
            .

      # 5. Build frontend image
      - name: Build frontend Docker image
        run: |
          docker build \
            -f frontend/Dockerfile \
            -t "$FRONTEND_IMAGE" \
            .

      # 6. Login to Docker Hub
      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
          docker login \
            -u "${{ secrets.DOCKERHUB_USERNAME }}" \
            --password-stdin

      # 7. Push backend image
      - name: Push backend image
        run: |
          docker push "$BACKEND_IMAGE"

      # 8. Push frontend image
      - name: Push frontend image
        run: |
          docker push "$FRONTEND_IMAGE"

      # 9. Login to Rahti
      - name: Login to Rahti
        run: |
          oc login \
            --server="${{ secrets.RAHTI_SERVER }}" \
            --token="${{ secrets.RAHTI_TOKEN }}"

      # 10. Select Rahti project
      - name: Select Rahti project
        run: |
          oc project aps

      # 11. Update backend deployment
      - name: Update backend deployment
        run: |
          oc set image deployment/backend \
            backend="$BACKEND_IMAGE"

      # 12. Update frontend deployment
      - name: Update frontend deployment
        run: |
          oc set image deployment/assignment-2 \
            assignment-2="$FRONTEND_IMAGE"

      # 13. Wait for backend deployment
      - name: Wait for backend deployment
        run: |
          oc rollout status deployment/backend

      # 14. Wait for frontend deployment
      - name: Wait for frontend deployment
        run: |
          oc rollout status deployment/assignment-2

      # 15. Check pods
      - name: Check pods
        run: |
          oc get pods

      # 16. Check deployments
      - name: Check deployments
        run: |
          oc get deployments

      # 17. Check services
      - name: Check services
        run: |
          oc get services

      # 18. Check routes
      - name: Check routes
        run: |
          oc get routes