name: Build and Deploy Frontend and Backend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # 1. Download the latest project code from GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install OpenShift CLI
      - name: Install OpenShift CLI
        uses: redhat-actions/oc-installer@v1

      # ============================================================
      # FRONTEND
      # ============================================================

      # 3. Create frontend image name
      - name: Set frontend image name
        run: |
          echo "FRONTEND_IMAGE=apar202511/lemp-containers-frontend:${GITHUB_SHA}" >> $GITHUB_ENV

      # 4. Build frontend Docker image
      - name: Build frontend Docker image
        run: |
          docker build \
            -f frontend/Dockerfile \
            -t "$FRONTEND_IMAGE" \
            frontend

      # ============================================================
      # BACKEND
      # ============================================================

      # 5. Create backend image name
      - name: Set backend image name
        run: |
          echo "BACKEND_IMAGE=apar202511/lemp-containers-backend:${GITHUB_SHA}" >> $GITHUB_ENV

      # 6. Build backend Docker image
      - name: Build backend Docker image
        run: |
          docker build \
            -f backend/Dockerfile \
            -t "$BACKEND_IMAGE" \
            .

      # ============================================================
      # DOCKER HUB
      # ============================================================

      # 7. Login to Docker Hub
      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
          docker login \
            -u "${{ secrets.DOCKERHUB_USERNAME }}" \
            --password-stdin

      # 8. Push frontend image
      - name: Push frontend image
        run: |
          docker push "$FRONTEND_IMAGE"

      # 9. Push backend image
      - name: Push backend image
        run: |
          docker push "$BACKEND_IMAGE"

      # ============================================================
      # RAHTI
      # ============================================================

      # 10. Login to Rahti
      - name: Login to Rahti
        run: |
          oc login \
            --server="${{ secrets.RAHTI_SERVER }}" \
            --token="${{ secrets.RAHTI_TOKEN }}"

      # 11. Select Rahti project
      - name: Select Rahti project
        run: |
          oc project aps

      # ============================================================
      # DEPLOY FRONTEND
      # ============================================================

      # 12. Update frontend deployment
      - name: Update frontend deployment
        run: |
          oc set image deployment/assignment-2 \
            assignment-2="$FRONTEND_IMAGE"

      # 13. Wait for frontend deployment
      - name: Wait for frontend deployment
        run: |
          oc rollout status deployment/assignment-2

      # ============================================================
      # DEPLOY BACKEND
      # ============================================================

      # 14. Update backend deployment
      - name: Update backend deployment
        run: |
          oc set image deployment/backend \
            backend="$BACKEND_IMAGE"

      # 15. Wait for backend deployment
      - name: Wait for backend deployment
        run: |
          oc rollout status deployment/backend

      # ============================================================
      # CHECK EVERYTHING
      # ============================================================

      # 16. Check running pods
      - name: Check pods
        run: |
          oc get pods

      # 17. Check deployments
      - name: Check deployments
        run: |
          oc get deployments

      # 18. Check services
      - name: Check services
        run: |
          oc get services

      # 19. Check routes
      - name: Check routes
        run: |
          oc get routes